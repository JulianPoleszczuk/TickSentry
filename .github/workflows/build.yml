name: Build

# Every branch, not just main: a feature branch that never opens a pull request would
# otherwise reach main having never been built, and the Java 11 bytecode check below is
# exactly the kind of breakage nobody notices by reading a diff.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A push to a branch with an open pull request triggers both events. Superseded runs of the
# same ref are pointless once a newer commit exists.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # JDK 21 is only needed to build - the produced bytecode targets Java 11.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run the tests
        run: ./gradlew build --no-daemon

      - name: Check that the jar still targets Java 11
        run: |
          unzip -o -q build/libs/TickSentry-*.jar -d /tmp/jarcheck
          # Bytes 7 and 8 of a .class file hold the bytecode major version. 55 means Java 11.
          # Reading them directly beats javap here - no JVM start per class, no name mangling.
          VERSIONS=$(find /tmp/jarcheck -name '*.class' -exec od -An -tu1 -j6 -N2 {} \; \
            | awk '{print $1 * 256 + $2}' | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "major versions in the jar: $VERSIONS"
          if [ "$VERSIONS" != "55" ]; then
            echo "::error::Expected every class at major version 55 (Java 11), found: $VERSIONS"
            exit 1
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: TickSentry-jar
          path: build/libs/TickSentry-*.jar

      - name: Upload the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
