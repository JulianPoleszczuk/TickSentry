name: Release

# Tag a commit with v1.0.0 (or any v*) and push the tag - this builds the plugin
# and attaches the jar to a GitHub release, so people can download it directly.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run the tests
        run: ./gradlew build --no-daemon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/TickSentry-*.jar
          generate_release_notes: true
