name: TickSentry
version: '${version}'
main: dev.poleszczuk.ticksentry.TickSentryPlugin
api-version: '1.16'
description: Continuous server performance monitoring with automatic lag source detection and Discord alerts.
author: Julian Poleszczuk
website: https://github.com/JulianPoleszczuk/TickSentry
# All optional. spark and PlaceholderAPI add detail; the three protection plugins let alerts
# name whose land a suspicious chunk sits on. Every hook is reflective, so a missing plugin
# costs nothing.
softdepend: [spark, PlaceholderAPI, WorldGuard, GriefPrevention, Towny]

# Paper downloads this library itself on first start - it does not have to sit in the jar.
libraries:
  - org.xerial:sqlite-jdbc:3.47.1.0

commands:
  lagwatch:
    description: Manage lag monitoring.
    # Keep this in step with command.usage in messages.yml and SUBCOMMANDS in LagWatchCommand.
    usage: /lagwatch <status|report|plugins|worlds|history|offenders|stats|reload>
    aliases: [ts, ticksentry]
    permission: ticksentry.admin

permissions:
  ticksentry.admin:
    description: Access to TickSentry commands.
    default: op
    children:
      ticksentry.alerts: true
      ticksentry.teleport: true
  ticksentry.alerts:
    description: Receive lag alerts in the game chat.
    default: op
  # Treat this as a teleport permission, not a reporting one: it lets the holder reach any
  # coordinates in any loaded world, which is more than being allowed to read the reports.
  ticksentry.teleport:
    description: Use the teleport button in reports to jump to a reported chunk.
    default: op
