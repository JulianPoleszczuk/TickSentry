# TickSentry configuration
# After editing, run /lagwatch reload

monitor:
  # Average tick time (MSPT) above which the server counts as overloaded.
  # A healthy server usually sits at 5-25 ms. 50 ms means it can no longer hold 20 TPS.
  mspt-threshold-ms: 50
  # How long (in seconds) the threshold must be exceeded without a break before an alert fires.
  # Prevents alerts on single spikes, such as a world save.
  sustained-seconds: 10
  # Minimum gap between alerts, so the channel does not get spammed.
  scan-cooldown-seconds: 300
  # How many recent ticks the rolling average covers.
  rolling-average-ticks: 100
  # Send a separate message once the server recovers?
  recovery-alert: true
  # How many seconds below the threshold mean the lag is over.
  recovery-seconds: 15
  # Also tell admins who are in the game? They need the ticksentry.alerts permission.
  in-game-alerts: true

  # A fixed 50 ms suits the average server and nobody else. A server that habitually runs at
  # 45 ms gets an alert for every hiccup; one that runs at 8 ms can quintuple its tick time -
  # a real regression - and never say a word.
  #
  # With this on, the threshold becomes a multiple of what YOUR server normally does. The
  # baseline is the median tick time of the last hour, so a few bad minutes cannot teach it
  # that bad is normal, and samples taken during an incident are not counted at all.
  adaptive-threshold:
    enabled: false
    # Alert once the server is this many times slower than it usually is.
    multiplier: 2.0
    # Never alert below this, however fast the server normally is. Without a floor, a very
    # quick server would alert on ordinary jitter.
    minimum-ms: 25
    # Always alert above this, however slow the server normally is. Without a ceiling, a
    # permanently broken server would quietly learn that 300 ms is fine.
    maximum-ms: 100
    # How much history the baseline is built from.
    baseline-minutes: 60

discord:
  enabled: true
  # Channel settings -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL
  webhook-url: ""
  # Optional role id to ping on alert (digits only, without <@&>).
  mention-role-id: ""

profiler:
  # Measure how long every other plugin spends inside its event handlers, so an alert can name
  # a plugin instead of a chunk. This is the only way TickSentry can catch lag that is not
  # caused by anything in the world.
  #
  # Cost: two timestamp reads around each handler call. On a busy server that is well under
  # 1% of a tick. Turn it off if you want TickSentry to touch nothing but its own listeners.
  enabled: true
  # How many seconds of measurements a report covers.
  window-seconds: 30

scan:
  # Worlds skipped while scanning, e.g. ['world_the_end']
  ignored-worlds: []
  # How many of the most suspicious chunks to analyse.
  top-chunks-count: 5

storage:
  # Write incidents to a file so they survive a server restart?
  # With false, the history only lives in memory.
  enabled: true
  # After how many days old entries are deleted (0 = keep everything).
  keep-days: 30
  # How far back to look when deciding whether a chunk is a repeat offender. A chunk named by
  # several incidents inside this window is a standing problem, not a coincidence, and alerts
  # say so. Also the default period for /lagwatch offenders.
  offender-days: 7

# Letting the plugin clean up after itself.
#
# READ THIS BEFORE TURNING IT ON. Everything else in TickSentry only looks at your server.
# This section is the one part that deletes things your players own, and no restart undoes it.
#
# It is off by default, and starts in dry-run when you switch it on, so you can watch what it
# would have done for a few days before letting it act. Players in the affected world are always
# warned first, and these are never removed, whatever the numbers say:
#   named mobs, tamed pets, leashed animals, anything riding or being ridden, renamed items,
#   and any type you list under protected-types.
remediation:
  enabled: false
  # Report what would have happened instead of doing it. Leave this on until you trust it.
  dry-run: true
  # How long players are warned before anything disappears.
  warning-seconds: 30
  # Never clean up more often than this.
  cooldown-seconds: 600

  clear-items:
    enabled: true
    # Only chunks holding at least this many dropped items and experience orbs.
    threshold: 300

  cap-mobs:
    # Off even when remediation is on - killing mobs is a bigger decision than sweeping litter.
    enabled: false
    # Only when one type reaches this many in a single chunk.
    threshold: 300
    # How many of that type to leave behind. A farm keeps working, it just stops growing.
    keep: 50
    # Never removed, however many there are.
    protected-types:
      - VILLAGER
      - WANDERING_TRADER
      - IRON_GOLEM
      - SNOWMAN
      - HORSE
      - DONKEY
      - MULE
      - LLAMA
      - TRADER_LLAMA
      - CAT
      - OCELOT
      - WOLF
      - PARROT
      - ALLAY
      - AXOLOTL
      - ARMOR_STAND
      - ITEM_FRAME
      - GLOW_ITEM_FRAME
      - PAINTING
      - MINECART
      - CHEST_MINECART
      - HOPPER_MINECART
      - FURNACE_MINECART
      - BOAT

dashboard:
  # Web panel with a chart and an incident list, viewable in a browser.
  # It runs on the same machine as the server - nothing needs hosting anywhere.
  enabled: false
  # NOTE: the connection is plain HTTP. The address 127.0.0.1 means access from this
  # computer only - the safest setting. To reach it from another device use an SSH
  # tunnel or put a reverse proxy with HTTPS in front of it. Setting 0.0.0.0 exposes
  # the panel to the network unencrypted, token included.
  bind: "127.0.0.1"
  port: 8080
  # Empty = the plugin generates a random token on first start and writes it here.
  token: ""
  # Also serve /metrics in the Prometheus format, so Grafana can chart TPS, tick time, memory
  # and per-plugin handler time next to the rest of your machine's metrics. Uses the same
  # token; point your scrape at http://host:port/metrics?token=... or send X-Auth-Token.
  metrics: true

# How expensive the plugin treats each kind of object, compared to an average mob (= 1.0).
# You only need this if alerts blame the wrong thing on your server. Anything you do not
# list here keeps its built-in value, so add only what you want to change.
#
# Examples:
#   weights:
#     entities:
#       VILLAGER: 5.0     # villagers hurt more on my server than the default 3.0
#       ITEM: 0.2         # I already clear dropped items often, stop blaming them
#     block-entities:
#       HOPPER: 5.0       # my sorting systems are the usual suspect
weights:
  entities: {}
  block-entities: {}
