# TickSentry - the text your players and moderators see in chat.
#
# This file covers everything a person reads: the lag warning, every /lagwatch reply, the
# Discord alert, the %ticksentry_...% placeholders, and the names of the causes.
#
# The server console stays English and is not configurable here. Console lines are what people
# paste into bug reports and search engines, so translating them would help nobody.
#
# Use & for colours (&c red, &e yellow, &7 grey, &f white, &b aqua, &8 dark grey).
# Anything in {braces} is filled in by the plugin - keep the spelling, move it where you like.
# After editing, run /lagwatch reload.
#
# A key you delete falls back to the English copy inside the jar, so an incomplete file is
# safe. New keys added by an update behave the same way.

# The Discord alert. Colour codes are stripped from these - Discord would print the section
# signs as literal characters - but Discord's own **bold** and _italics_ work fine.
discord:
  title-alert: "Heads up: the server is lagging"
  title-requested: "Requested report: the server is lagging"
  title-healthy: "Requested report: the server looks healthy"
  title-recovered: "Server is back to normal"
  title-remediation: "Automatic clean-up"
  # {cause} {explanation}
  description: "The server cannot keep up with the world - players may feel the delay.\n**Likely cause: {cause}** ({explanation})"
  description-healthy: "Checked on an admin's request. The server keeps up with the world."
  description-recovered: "The lag is over - the server keeps up with the world again."
  # {chunks} {entities}
  footer: "TickSentry - scanned {chunks} chunks, {entities} entities in total"
  # {history}
  repeat: "This chunk was already {history}. Fixing it once would stop this coming back."
  field:
    health: "Server health"
    where: "Where to look"
    repeat: "Not the first time"
    what-to-do: "What to do"
    plugin: "Plugin"
    chunk-loading: "Chunk loading"
    memory: "Memory"
    spark: "More precise measurement"
    others: "Other suspicious places"
    duration: "How long it lasted"
    right-now: "Right now"

# Replies to /lagwatch. {colour} placeholders receive a colour the plugin picked from the
# numbers (green when healthy, red when not) - keep them where the value starts.
command:
  no-permission: "&cYou do not have permission."
  usage: "&cUsage: /{label} <status|report|plugins|history|offenders|stats|reload>"
  header: "&8--- &bTickSentry &f{section} &8---"
  # The button appended to every line that has coordinates. Shown only to players holding
  # ticksentry.teleport - console and everyone else get the plain line.
  teleport-button: "&8 [&bTP&8]"
  # {location}
  teleport-hover: "&7Click to teleport to &f{location}"
  section:
    status: "Status"
    report: "Report"
    plugins: "Plugins"
    history: "History"
    # {days}
    offenders: "Repeat offenders ({days} days)"
    stats: "Stats ({days} days)"
    reload: "Reload"

status:
  monitoring: "&7Monitoring: {state}"
  monitoring-running: "&arunning"
  monitoring-stopped: "&cstopped"
  # Shown on Folia, where each region ticks on its own thread and no single thread may read the
  # whole world - so alerts can name a plugin or memory, but never a chunk.
  limited-mode: "&eLimited mode: no chunk scan on this server - see the startup log."
  # {colour} {tps}
  tps: "&7TPS: {colour}{tps}&8 / 20"
  # {colour} {mspt} {threshold}
  mspt: "&7Tick time: {colour}{mspt} ms&8 (threshold: {threshold} ms)"
  # Shown only when monitor.trigger-on is not 'average', so the tick time line above is not read
  # as the number being watched. {metric} {value}
  trigger-on: "&7Watching: &f{metric}&8 (currently {value} ms)"
  # The tick times your bad ticks reach. An average of 20 ms with a p99 of 400 ms is a server that
  # stutters, and the average alone would call it healthy. {colour} {p95} {p99} {worst}
  percentiles: "&7Bad ticks: {colour}p95 {p95} ms&7, p99 &f{p99} ms&8 (worst single tick {worst} ms)"
  # {peak}
  peak: "&7Longest freeze in window: &f{peak} ms"
  # Shown only on a server with no per-tick measurements, so the numbers above are not mistaken
  # for something finer than they are. {source}
  tick-source: "&8 measured from {source}"
  # {baseline}
  adaptive-ready: "&7Threshold: &fadaptive - this server normally runs at {baseline} ms"
  # {have} {need}
  adaptive-learning: "&7Threshold: &fadaptive - still learning ({have}/{need} samples, using the fixed value)"
  # {seconds} {after}
  breach: "&cThreshold exceeded for {seconds} s (alert after {after} s)."
  # {seconds}
  cooldown: "&7Next alert possible in &f{seconds} s&7."
  discord: "&7Discord: {state}"
  discord-configured: "&aconfigured"
  discord-missing: "&edisabled or webhook missing"
  # {spark}
  spark: "&7Spark: &f{spark}"
  spark-missing: "&7Spark: &8unavailable (using built-in measurements)"
  remedy-off: "&7Automatic clean-up: &8off (the plugin only looks, it changes nothing)"
  # {next}
  remedy-dry-run: "&7Automatic clean-up: &edry-run (reports only){next}"
  remedy-active: "&7Automatic clean-up: &cACTIVE{next}"
  # {seconds}
  remedy-next: "&8 - next in {seconds} s"
  protection-hooked: "&7Land protection: &ahooked - alerts can name an owner"
  protection-missing: "&7Land protection: &8none found (falling back to who was last seen there)"
  # {memory}
  memory: "&7Memory: &f{memory}"
  # {store} {recent}
  history: "&7History: &f{store}&8 ({recent} in the last 24 h)"

report:
  already-running: "&eA scan is already running - the result will show up shortly."
  # {tps} {mspt} {chunks} {entities}
  summary: "&7TPS &f{tps}&7, tick time &f{mspt} ms&7, scanned &f{chunks}&7 chunks ({entities} entities)."
  calm: "&aNo chunk stands out - the game world looks calm."
  # {cause}
  cause: "&7Likely cause: &b{cause}"
  # {advice}
  advice: "&e{advice}"
  # {note} - the memory, plugin and chunk-loading notes all use this one
  note: "&e{note}"
  # {spark}
  spark: "&8{spark}"
  # {index} {location} {entities} {tiles} {dominant}
  chunk: "&8 {index}. &f{location}&7 - {entities} entities, {tiles} block entities{dominant}"
  # {count} {type}
  chunk-dominant: "&8 (mostly {count}x {type})"
  # {attribution}
  chunk-owner: "&8    {attribution}"
  # {history}
  chunk-history: "&e    repeat offender: {history}"
  sent-to-discord: "&7Report also sent to Discord."
  discord-unconfigured: "&cDiscord is disabled or the webhook URL is empty."

plugins:
  disabled: "&eProfiling is off - set profiler.enabled to true in config.yml."
  nothing-measured: "&aNothing measured yet - give it a few seconds."
  # {seconds} {handlers}
  window: "&7Event handler time over the last {seconds} s&8 ({handlers} handlers watched)"
  # {index} {colour} {plugin} {ms} {share} {event}
  entry: "&8 {index}. {colour}{plugin}&7 - {ms} ms ({share}%)&8 {event}"
  all-clear: "&aNo plugin stands out - none of them is holding the tick."
  # {tasks}
  pending-tasks: "&7Pending scheduler tasks: &8{tasks}"

history:
  empty: "&aNo incidents recorded yet."
  # {time} {ago} {mspt} {cause} {location} {manual}
  entry: "&8{time}&7 ({ago} ago) &f{mspt} ms&7 - {cause}{location}{manual}"
  # {location}
  at: "&8 @ {location}"
  manual: "&8 [manual]"

offenders:
  empty: "&aNo chunk has been behind more than one incident - nothing here is a standing problem."
  # {index} {colour} {location} {hits} {total} {worst} {ago}
  entry: "&8 {index}. {colour}{location}&7 - behind {hits} of the last {total} incidents (worst {worst} ms)&8, last {ago} ago"
  # {location} {x} {z}
  start-here: "&eStart with {location} - fixing that one place would have prevented most of these. /tp {x} ~ {z}"

stats:
  empty: "&aNo incidents in this period - the server held up well."
  # {count}
  recorded: "&7Recorded: &f{count}"
  # {cause} {count}
  dominant-cause: "&7Most common cause: &b{cause}&8 ({count}x)"
  # {hour} {count}
  worst-hour: "&7Worst time of day: &f{hour}:00-{hour}:59&8 ({count})"
  # {mspt} {when} {location}
  worst-moment: "&7Worst moment: &f{mspt} ms&8 {when} - {location}"
  histogram-header: "&7Spread across the day:"
  # {row}
  histogram-row: "&8 {row}"

teleport:
  no-permission: "&cYou do not have permission to teleport."
  players-only: "&cOnly a player can be teleported."
  # {label}
  usage: "&cUsage: /{label} tp <world> <x> <z>"
  # {world}
  unknown-world: "&cThere is no loaded world called {world}."
  # {location}
  done: "&aTeleported to &f{location}&a."

reload:
  # {threshold} {seconds} {adaptive}
  done: "&aConfiguration reloaded. Threshold: {threshold} ms for {seconds} s.{adaptive}"
  adaptive-relearning: " The adaptive threshold is relearning this server's normal tick time."

alert:
  # Placeholders: {cause} {location} {x} {z}
  lagging: "&c[TickSentry] &eServer is lagging: &b{cause}&7 at &f{location}&8 (/tp {x} ~ {z})"
  # Shown when no single chunk was to blame. Placeholders: {cause}
  lagging-no-location: "&c[TickSentry] &eServer is lagging: &b{cause}"
  # Who the place belongs to. Placeholders: {attribution}
  attribution: "&8           {attribution}"
  # Shown when that chunk has caused trouble before. Placeholders: {history}
  repeat-offender: "&6           not the first time: {history}"

remedy:
  # Warning before dropped items are swept. Placeholders: {location} {seconds}
  warning-items: "&e[TickSentry] &7Dropped items at &f{location}&7 will be cleared in &f{seconds}&7 s."
  # Warning before mobs are removed. Placeholders: {type} {location} {seconds}
  warning-mobs: "&e[TickSentry] &7Some of the &f{type}&7 at &f{location}&7 will be removed in &f{seconds}&7 s."
  # Sent to admins afterwards. Placeholders: {summary}
  summary: "&e[TickSentry] &7{summary}"

# What the %ticksentry_...% placeholders return. These land on scoreboards and in chat formats,
# so keep them short.
placeholder:
  status-ok: "OK"
  status-lag: "LAG"
  monitoring-running: "running"
  monitoring-stopped: "stopped"
  no-category: "none"

update:
  # Shown to admins on join. Placeholders: {latest} {current} {url}
  available: "&b[TickSentry] &7Version &f{latest}&7 is out (you have {current}). &8{url}"

# The advice sentences - what the plugin tells you to DO about each cause. They show up in the
# console, in /lagwatch report, and in the Discord alert.
#
# These are NOT listed with English values on purpose. The English lives in the code, so there
# is no second copy here to drift out of step with it. Uncomment a line and write your own to
# replace it; leave it commented and you keep the built-in English.
#
# The placeholders each key accepts are written above it. {kill} is a ready /kill command and
# {tp} a ready /tp command - keep them if you want people to be able to paste them.
advice:
  # {tp} {count} {type} {kill}
  #mob-farm: "Idź tam ({tp}). Podejrzana farma: {count}x {type}. Szybka naprawa: {kill}"
  # {tp}
  #mob-farm-unknown: "Idź tam ({tp}) i zobacz, co się nazbierało."
  # {tp} {kill}
  #item-clutter: "Posprzątaj wyrzucone przedmioty: {kill} (najpierw {tp}, żeby zobaczyć czyje)."
  # {tp} {count} {type}
  #redstone: "Sprawdź układ redstone ({tp}): {count}x {type}."
  # {tp}
  #redstone-unknown: "Sprawdź układ redstone w tym miejscu ({tp})."
  # {tp} {count}
  #spawners: "{count} spawnerów w jednym chunku ({tp}). Każdy ciągle szuka miejsca na moba."
  # {tp}
  #spawners-unknown: "Sprawdź spawnery w tym miejscu ({tp})."
  # {tp} {count} {type} {kill}
  #minecarts: "{count}x {type} przy {tp}. Wagoniki z lejkami tickują nawet puste. Szybka naprawa: {kill}"
  # {tp}
  #minecarts-unknown: "Sprawdź wagoniki w tym miejscu ({tp})."
  # {tp} {count}
  #player-cluster: "{count} graczy w jednym chunku - jeśli to spawn albo event, lag jest normalny. Sprawdź: {tp}"
  # {tp} {count}
  #entity-overload: "Dużo różnych bytów ({count}) w jednym chunku. Zobacz: {tp}"
  # no placeholders
  #chunk-loading: "To nie jest kwestia jednego miejsca - patrz notatka o ładowaniu chunków niżej."
  #memory: "To nie jest kwestia świata - patrz notatka o pamięci niżej."
  #plugin: "To nie jest kwestia świata - patrz notatka o pluginie niżej."
  #unknown: "Żaden chunk się nie wyróżnia - przyczyna może być poza światem gry. Warto odpalić spark."

# What the plugin profiler reports. Same rule: uncomment to translate.
plugin-report:
  # {plugin} {share} {seconds} {ms} {event} {calls}
  #message: "{plugin} zużył {share}% ostatnich {seconds} s czasu serwera ({ms} ms, głównie w {event}, {calls} wywołań)."
  # {plugin}
  #suggestion: "Zacznij od {plugin}: zaktualizuj, sprawdź ustawienia albo wyłącz na chwilę. Liczenie mobów tu nie pomoże."

# What the memory watcher reports. {percent} {seconds} {collections} {memory} {heapPercent}
memory:
  #gc-serious: "Garbage collector zużył {percent}% ostatnich {seconds} s ({collections} zbiórek). Pamięć: {memory}."
  #gc-serious-heap-full: "Garbage collector zużył {percent}% ostatnich {seconds} s, a sterta jest prawie pełna ({memory}). Daj serwerowi więcej RAM (-Xmx)."
  #heap-full: "Pamięć prawie pełna: {memory}. Rozważ zwiększenie -Xmx."
  #gc-notable: "Garbage collector zajął {percent}% ostatnich {seconds} s. Pamięć: {memory}."

# What the chunk load detector reports.
chunk-load:
  # {loaded} {generated}
  #message: "Serwer ładuje {loaded} chunków na sekundę, w tym {generated} generowanych od zera."
  # no placeholders
  #generating: "Generuje się nowy teren - ktoś zwiedza, leci na elytrze albo działa pregenerator. Pregeneracja świata albo mniejszy view-distance to realna naprawa."
  #streaming: "Chunki są czytane z dysku wystarczająco szybko, żeby to bolało. Pomoże mniejszy view-distance albo szybszy dysk."

# Names of the causes. The title is what an alert calls it; the description explains it.
category:
  MOB_FARM:
    title: "Mob farm"
    description: "Lots of entities of the same type in one place"
  ITEM_CLUTTER:
    title: "Dropped items"
    description: "Hundreds of items or XP orbs lying on the ground"
  REDSTONE:
    title: "Redstone / hoppers"
    description: "Lots of hoppers, droppers or furnaces"
  SPAWNERS:
    title: "Mob spawners"
    description: "Several spawners running side by side"
  MINECARTS:
    title: "Minecart contraption"
    description: "A lot of minecarts, usually hopper carts under a farm"
  CHUNK_LOADING:
    title: "Chunk loading"
    description: "New land is being generated or read from disk"
  PLAYER_CLUSTER:
    title: "Player crowd"
    description: "Many players inside a single chunk"
  ENTITY_OVERLOAD:
    title: "Entity overload"
    description: "A large mix of different entities at once"
  MEMORY:
    title: "Memory / garbage collector"
    description: "The server ran out of breathing room in RAM"
  PLUGIN:
    title: "Plugin"
    description: "One plugin's event handlers are eating the tick"
  UNKNOWN:
    title: "No obvious source"
    description: "No chunk stands out clearly"
